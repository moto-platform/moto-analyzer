[package]
name = "moto-analyzer"
version = "0.1.0"
description = "Real-time Automotive CAN Bus Analyzer & Telemetry Cockpit"
authors = ["moto-platform"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
